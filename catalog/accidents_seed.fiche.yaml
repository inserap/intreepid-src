columns:
  accident_month:
    sens: mois de l'accident (1-12)
    type: numeric
  canton:
    sens: canton de l'accident (code officiel)
    type: categorical
  date:
    sens: 'date de l''accident (1er du mois : année + mois OFROU)'
    type: temporal
  geom:
    geometry_type_attendu: point
    piege: géolocalisation GPS depuis 2016, adresse avant -> précision variable
    sens: localisation de l'accident (point LV95)
    srid: 2056
    type: spatial
    unite: mètres
  severity:
    sens: gravité la plus élevée parmi les impliqués
    type: categorical
  type_route:
    sens: type de route (classification OFROU)
    type: categorical
  vitesse_limite_kmh:
    sens: vitesse limite (km/h)
    type: categorical
dataset: accidents_seed
data: ../fixtures/accidents_seed.parquet
exposures:
  canton:
    key: canton
    table: ../fixtures/canton_exposure.parquet
    weight: exposure
source: OFROU open data (ch.astra.unfaelle-personenschaeden_alle)
titre: Accidents de la circulation avec dommages corporels (sous-ensemble)
